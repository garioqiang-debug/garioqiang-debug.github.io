<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 这页不在档案里 | 葛应强</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#0a0e0b; --bg-soft:#111713; --ink:#eef3ea; --muted:#8d9b8f;
    --line:rgba(200,238,111,.16); --acid:#c8ee6f; --serif:"Noto Serif SC","Songti SC",serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink); font-family:var(--serif);
    min-height:100vh; display:flex; align-items:center;
    background-image:radial-gradient(120% 80% at 50% 0%, rgba(200,238,111,.07), transparent 60%);
  }
  .wrap{ width:100%; max-width:1180px; margin:0 auto; padding:0 clamp(18px,4vw,56px); }
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.22em;
    color:var(--muted); text-transform:uppercase; margin-bottom:18px;
  }
  .eyebrow::before{ content:""; display:inline-block; width:26px; height:1px; background:var(--acid); vertical-align:middle; margin-right:12px; }
  h1{ font-size:clamp(34px,6vw,72px); font-weight:600; line-height:1.2; letter-spacing:-.01em; }
  h1 em{ font-style:normal; color:var(--acid); }
  p{ color:var(--muted); font-size:15px; line-height:2; margin-top:18px; max-width:34em; }
  .links{ display:flex; flex-wrap:wrap; gap:10px; margin-top:32px; }
  .links a{
    text-decoration:none; color:var(--ink); font-size:13.5px;
    padding:11px 20px; border-radius:999px; border:1px solid var(--line);
    transition:border-color .3s, background .3s, color .3s;
  }
  .links a:hover{ border-color:rgba(200,238,111,.6); background:rgba(200,238,111,.08); }
  .links a.home{ background:var(--acid); color:#0a0e0b; border-color:var(--acid); font-weight:600; }
  .links a.home:hover{ background:#d7f78c; }
  footer{
    margin-top:56px; padding-top:18px; border-top:1px solid var(--line);
    font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Error 404 · Page not in archive</p>
    <h1>这页不在<em>档案</em>里。</h1>
    <p>可能是旧链接失效，也可能那篇文章被合并进别的稿子了。标本不会自己跑掉，网页会。</p>
    <div class="links">
      <a class="home" href="/">回个人门户</a>
      <a href="/作品集/">科普写作</a>
      <a href="/摄影/">自然摄影</a>
      <a href="/课程/">研学课程</a>
    </div>
    <footer>葛应强 · 昆虫学硕士 / 科普作家 / 自然教育导师</footer>
  </div>
</body>
</html>
